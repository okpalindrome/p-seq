<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>p-seq · pcap sequence viewer</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">P-SEQ</div>
  <div class="filterbox">
    <input id="filter" type="text" spellcheck="false"
           placeholder='display filter — e.g.  tcp && ip.addr == 10.0.0.1   |   udp.port == 53   |   payload contains 474554' />
    <button id="applyFilter" class="btn">Apply</button>
    <span id="matchCount" class="muted"></span>
  </div>
  <div class="topbar-actions">
    <button id="settingsBtn" class="btn ghost" title="Settings">⚙</button>
    <button id="exportBtn" class="btn" title="Export diagram as PNG">Export PNG</button>
  </div>
</header>

<main class="layout">

  <aside class="sidebar">
    <div class="upload">
      <div id="uploadArea">
        <label class="btn block" for="fileInput">Upload pcap</label>
        <div class="muted small upload-hint">pcap / pcapng / cap</div>
      </div>
      <input id="fileInput" type="file" accept=".pcap,.pcapng,.cap" hidden />
    </div>

    <div id="portPicker" class="port-picker hidden">
      <h4>Ports</h4>
      <div id="portPickerBody"></div>
    </div>

    <div id="renderArea">
      <button id="renderBtn" class="btn block" disabled>Render diagram</button>
      <div id="renderProgress" class="upload-progress hidden">
        <div class="upload-progress-head">
          <span class="upload-progress-stage" id="renderStage">Rendering</span>
          <span class="upload-progress-pct" id="renderElapsed">0.0s</span>
        </div>
        <div class="upload-bar"><div class="upload-bar-fill indeterminate"></div></div>
        <div class="upload-progress-meta">
          <span id="renderMeta"></span>
        </div>
      </div>
    </div>

    <h3 class="section-title">Parties</h3>
    <p class="muted small">Pick exactly two endpoints (max 2).</p>
    <ul id="endpointList" class="endpoint-list"></ul>

    <h3 class="section-title">History</h3>
    <ul id="historyList" class="history-list"></ul>
  </aside>

  <section class="diagram-pane">
    <div id="diagramTitle" class="diagram-title muted">No diagram yet — upload a pcap and pick two parties.</div>
    <div id="diagramWrap" class="diagram-wrap">
      <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="zoom-controls" title="Pinch / scroll to zoom · drag to pan">
        <button id="zoomOut" class="btn" title="Zoom out">−</button>
        <span id="zoomLevel" class="zoom-level">100%</span>
        <button id="zoomIn" class="btn" title="Zoom in">+</button>
        <button id="zoomFit" class="btn" title="Fit to view">Fit</button>
        <button id="zoomReset" class="btn" title="Reset (100%)">1:1</button>
      </div>
    </div>
  </section>

  <aside id="detailPane" class="detail-pane">
    <div class="detail-header">
      <span id="detailTitle">Packet details</span>
      <button id="closeDetail" class="btn ghost small" title="Close">×</button>
    </div>
    <div id="detailBody" class="detail-body">
      <p class="muted small">Click an arrow in the diagram to inspect the packet.</p>
    </div>
  </aside>

</main>

<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h3>Settings</h3>
    <label class="setting">
      <span>Collapse threshold (consecutive identical packets shown as dots)</span>
      <input id="collapseThreshold" type="number" min="2" max="9999" value="5" />
    </label>
    <label class="setting">
      <span>Show seconds in arrow labels</span>
      <input id="showSeconds" type="checkbox" />
    </label>
    <div class="modal-actions">
      <button id="closeSettings" class="btn">Done</button>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
